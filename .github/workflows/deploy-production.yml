# Deploy ONLY ./public/ to live site (public_html). Requires FTP secrets — see docs/GITHUB_ACTIONS.md
name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize FTP hostname
        id: ftp_host
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          h="$RAW"
          h="${h#ftp://}"
          h="${h#ftps://}"
          h="${h%/}"
          echo "host=$h" >> "$GITHUB_OUTPUT"

      - name: Resolve FTP server-dir (production)
        id: ftp_dir
        env:
          FTP_REMOTE_PRODUCTION_VAR: ${{ vars.FTP_REMOTE_PRODUCTION }}
          FTP_REMOTE_PRODUCTION_SECRET: ${{ secrets.FTP_REMOTE_PRODUCTION }}
        run: bash .github/scripts/resolve-ftp-server-dir.sh production

      - name: Upload to Hostinger (production)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp_host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          security: loose
          local-dir: ./public/
          server-dir: ${{ steps.ftp_dir.outputs.dir }}
          log-level: standard
          timeout: 600000
