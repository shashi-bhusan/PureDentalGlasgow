# Deploy ONLY ./public/ to Hostinger staging — no manual zip needed after one-time FTP secret setup.
# Remote path matches hPanel → Subdomains → staging.puredentalglasgow.com → Directory under public_html/staging
# If deploy fails, verify FTP user can see this folder after login (edit path below if Hostinger shows a different prefix).
name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload to Hostinger (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./public/
          server-dir: domains/puredentalglasgow.com/public_html/staging/
          log-level: standard
          timeout: 600000
