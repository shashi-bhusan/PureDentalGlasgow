# Deploy ONLY ./public/ to Hostinger staging.
# Default server-dir is public_html/staging/ — Hostinger often chroots FTP inside domains/puredentalglasgow.com/,
# so domains/.../public_html/staging/ would nest wrongly and the LIVE subdomain would never update.
# Override path: Repository Variable FTP_REMOTE_STAGING, or same name as a Secret (vars preferred).
name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strip ftp:// from secret — wrong prefix often causes instant failure.
      - name: Normalize FTP hostname
        id: ftp_host
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          h="$RAW"
          h="${h#ftp://}"
          h="${h#ftps://}"
          h="${h%/}"
          echo "host=$h" >> "$GITHUB_OUTPUT"

      - name: Show FTP target path (staging)
        run: |
          echo "FTP server-dir=${{ vars.FTP_REMOTE_STAGING || secrets.FTP_REMOTE_STAGING || 'public_html/staging/' }}"

      # Default explicit FTPS on 21 (GitHub runners often time out on 990).
      # Override: Variables FTP_PORT=990 and FTP_PROTOCOL=ftps-legacy if your host requires implicit FTPS.
      - name: Upload to Hostinger (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp_host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          security: loose
          local-dir: ./public/
          server-dir: ${{ vars.FTP_REMOTE_STAGING || secrets.FTP_REMOTE_STAGING || 'public_html/staging/' }}
          log-level: standard
          timeout: 600000

  # Confirms staging serves the new footer. curl exit 28 = timeout — often fixed with -4 (IPv4) + retries from GitHub runners.
  verify-staging-footer:
    needs: ftp-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify new footer is live on staging
        run: |
          set -euo pipefail
          url="https://staging.puredentalglasgow.com/?_gha=$(date +%s)"
          echo "Fetching: $url"
          set +e
          # -4: avoid IPv6 hangs; retries + generous timeouts for cross-region HTTPS
          html="$(curl -4 -fsSL \
            --connect-timeout 45 \
            --max-time 180 \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            "$url")"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not download staging homepage (curl exit $rc). 28 = operation timed out — runner network/DNS to Hostinger."
            echo "::error::Open https://staging.puredentalglasgow.com/ in your browser to confirm the site; if the footer is new, you can ignore this flake or re-run."
            echo "::error::If the footer is still old, fix FTP path (Variable or Secret FTP_REMOTE_STAGING) — see docs/GITHUB_ACTIONS.md"
            exit 1
          fi
          if echo "$html" | grep -q 'Healing Waters'; then
            echo "OK: staging homepage includes new footer."
          else
            echo "::error::Download succeeded but OLD footer still in HTML (no 'Healing Waters'). FTP likely wrote to the wrong folder."
            echo "::error::Set FTP_REMOTE_STAGING (repo Variable or Secret) to the FileZilla path that contains staging index.html (trailing /)."
            exit 1
          fi
