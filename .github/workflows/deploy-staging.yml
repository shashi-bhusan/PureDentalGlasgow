# Deploy ONLY ./public/ to Hostinger staging — no manual zip needed after one-time FTP secret setup.
# Remote path matches hPanel → Subdomains → staging.puredentalglasgow.com → Directory under public_html/staging
# If deploy fails, verify FTP user can see this folder after login (edit path below if Hostinger shows a different prefix).
name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strip ftp:// from secret — wrong prefix often causes instant failure.
      - name: Normalize FTP hostname
        id: ftp_host
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          h="$RAW"
          h="${h#ftp://}"
          h="${h#ftps://}"
          h="${h%/}"
          echo "host=$h" >> "$GITHUB_OUTPUT"

      # Default explicit FTPS on 21 (GitHub runners often time out on 990).
      # Override: Variables FTP_PORT=990 and FTP_PROTOCOL=ftps-legacy if your host requires implicit FTPS.
      - name: Upload to Hostinger (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp_host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          security: loose
          local-dir: ./public/
          # Override path if deploy succeeds but site unchanged: repo Variable FTP_REMOTE_STAGING (must end with /), e.g. public_html/staging/
          server-dir: ${{ vars.FTP_REMOTE_STAGING || 'domains/puredentalglasgow.com/public_html/staging/' }}
          log-level: standard
          timeout: 600000

  # Fails the workflow if FTP reported success but staging URL still has the old footer (wrong remote path or cache).
  verify-staging-footer:
    needs: ftp-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify new footer is live on staging
        run: |
          set -euo pipefail
          url="https://staging.puredentalglasgow.com/?_gha=$(date +%s)"
          html="$(curl -fsSL --max-time 90 "$url")"
          if echo "$html" | grep -q 'Healing Waters'; then
            echo "OK: staging homepage includes new footer."
          else
            echo "::error::Staging still shows the OLD footer after FTP. The upload likely went to the wrong folder."
            echo "::error::In FileZilla, open the staging folder that contains index.html and copy the remote path from the status bar."
            echo "::error::Then add GitHub repo Variable FTP_REMOTE_STAGING (trailing slash) to match — see docs/GITHUB_ACTIONS.md"
            exit 1
          fi
