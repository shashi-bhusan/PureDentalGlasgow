# Deploy ONLY ./public/ to Hostinger staging.
# server-dir is relative to the FTP user’s directory after login (see “Diagnostic — FTPS list” in logs).
# Override: Secret or Variable FTP_REMOTE_STAGING (Variable wins if non-empty after trim).
name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tiny file proves HTTPS document root == FTP server-dir (wrong path → 404 or stale content).
      - name: Write staging deploy check file
        run: printf '%s %s\n' "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/STAGING_DEPLOY_CHECK.txt

      # Strip ftp:// from secret — wrong prefix often causes instant failure.
      - name: Normalize FTP hostname
        id: ftp_host
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          h="$RAW"
          h="${h#ftp://}"
          h="${h#ftps://}"
          h="${h%/}"
          echo "host=$h" >> "$GITHUB_OUTPUT"

      - name: Warn if Variables tab overrides Secret
        if: ${{ vars.FTP_REMOTE_STAGING != '' }}
        run: |
          echo '::warning::Repository Variable FTP_REMOTE_STAGING is set — it overrides the Secret with the same name. If the path is wrong or old, delete that Variable (Settings → Secrets and variables → Actions → Variables), then re-run.'

      # Variable wins over Secret only if non-empty after trim (whitespace-only Variable no longer blocks Secret).
      - name: Resolve FTP server-dir (staging)
        id: ftp_dir
        env:
          FTP_REMOTE_STAGING_VAR: ${{ vars.FTP_REMOTE_STAGING }}
          FTP_REMOTE_STAGING_SECRET: ${{ secrets.FTP_REMOTE_STAGING }}
        run: bash .github/scripts/resolve-ftp-server-dir.sh staging

      # Shows what exists at FTP login root — use this to choose server-dir (domains/... vs public_html/...).
      - name: Diagnostic — FTPS list remote root (first entries)
        continue-on-error: true
        env:
          HOST: ${{ steps.ftp_host.outputs.host }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
          PORT: ${{ vars.FTP_PORT || '21' }}
        run: |
          echo "::group::FTP directory listing (helps validate FTP_REMOTE_STAGING)"
          curl -4 -g --ssl-reqd --connect-timeout 30 --max-time 60 \
            --list-only "ftps://${HOST}:${PORT}/" \
            --user "${USER}:${PASS}" -k 2>&1 | head -50 || echo "(listing failed — ignore if FTPS differs; use FileZilla + same FTP user.)"
          echo "::endgroup::"

      # Default explicit FTPS on 21 (GitHub runners often time out on 990).
      # Override: Variables FTP_PORT=990 and FTP_PROTOCOL=ftps-legacy if your host requires implicit FTPS.
      - name: Upload to Hostinger (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp_host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          security: loose
          local-dir: ./public/
          server-dir: ${{ steps.ftp_dir.outputs.dir }}
          log-level: standard
          timeout: 600000

  # Confirms staging serves the new footer. curl exit 28 = GitHub runner ↔ Hostinger flake (not always wrong FTP).
  verify-staging-footer:
    needs: ftp-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify new footer is live on staging
        env:
          VERIFY_STAGING_SOFT_FAIL: ${{ vars.VERIFY_STAGING_SOFT_FAIL }}
          EXPECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Hard wall-clock cap: curl --retry-all-errors can otherwise hang past --max-time on some runners.
          fetch() {
            local u="$1"
            timeout 280 curl -4 -fsSL --http1.1 \
              --connect-timeout 25 \
              --max-time 220 \
              --retry 4 \
              --retry-delay 10 \
              --retry-all-errors \
              -H 'User-Agent: Mozilla/5.0 (compatible; PDG-Staging-Verify/1.0)' \
              "$u"
          }
          marker_url="https://staging.puredentalglasgow.com/STAGING_DEPLOY_CHECK.txt?_=$(date +%s)"
          echo "Fetching deploy marker: $marker_url"
          set +e
          marker="$(fetch "$marker_url")"
          mrc=$?
          set -e
          if [ "$mrc" -ne 0 ] || ! echo "$marker" | tr -d '\r' | grep -q "^${EXPECT_SHA}"; then
            echo "::error::STAGING_DEPLOY_CHECK.txt missing or does not start with this commit SHA. FTP is NOT writing the folder that serves https://staging.puredentalglasgow.com/ — FTP_REMOTE_STAGING is still wrong for this FTP user."
            echo "::error::Open ftp-deploy → **Diagnostic — FTPS list remote root** and set FTP_REMOTE_STAGING to the path from that listing to your staging folder (or create an FTP sub-account whose home IS staging and set path to .)."
            echo "Marker HTTP exit=$mrc body (first 200 chars): ${marker:0:200}"
            exit 1
          fi
          echo "OK: deploy marker visible at document root (FTP path matches this URL)."
          url="https://staging.puredentalglasgow.com/?_gha=$(date +%s)"
          echo "Fetching: $url"
          set +e
          html="$(fetch "$url")"
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "First fetch: GNU timeout killed curl (wall-clock >280s)."
            rc=28
          fi
          if [ "$rc" -ne 0 ] || [ -z "${html:-}" ]; then
            echo "First fetch failed (curl/timeout rc=$rc). Waiting 45s, second attempt..."
            sleep 45
            url="https://staging.puredentalglasgow.com/?_gha=$(date +%s)"
            set +e
            html="$(fetch "$url")"
            rc=$?
            set -e
            if [ "$rc" -eq 124 ]; then
              echo "Second fetch: GNU timeout killed curl (wall-clock >280s)."
              rc=28
            fi
          fi
          if [ "$rc" -ne 0 ] || [ -z "${html:-}" ]; then
            echo "::error::Could not download staging homepage after 2 tries (last exit $rc; 124=outer timeout, 28=curl timeout). Flaky GitHub runner → Hostinger; FTP deploy may still be OK."
            echo "::error::Open https://staging.puredentalglasgow.com/ in a browser; if the footer is new, re-run verify or set Variable VERIFY_STAGING_SOFT_FAIL=true (see docs/GITHUB_ACTIONS.md)."
            echo "::error::If the footer is still old, fix FTP_REMOTE_STAGING — see docs/GITHUB_ACTIONS.md"
            case "${VERIFY_STAGING_SOFT_FAIL:-}" in
              true|TRUE|1|yes|YES) echo "::warning::VERIFY_STAGING_SOFT_FAIL set — passing workflow despite curl failure."; exit 0 ;;
            esac
            exit 1
          fi
          if echo "$html" | grep -q 'Healing Waters'; then
            echo "OK: staging homepage includes new footer."
          else
            echo "::error::Download succeeded but OLD footer still in HTML (no 'Healing Waters'). FTP is not updating the URL's document root."
            echo "::error::In GitHub: delete repository VARIABLE FTP_REMOTE_STAGING if you use a Secret (Variable overrides Secret). Open this run → job ftp-deploy → step **Diagnostic — FTPS list remote root**: if you see **domains** there, server-dir often must start with **domains/...**; if you only see **public_html**, use **public_html/staging/**. Match FileZilla for the **same** FTP user as GitHub."
            echo "---- Lines mentioning footer / rights (for debugging) ----"
            echo "$html" | grep -ni "pure dental\|healing\|maintained\|rights reserved\|copyright" | head -20 || true
            exit 1
          fi
