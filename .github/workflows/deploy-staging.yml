# Deploy ONLY ./public/ to Hostinger staging — no manual zip needed after one-time FTP secret setup.
# Remote path matches hPanel → Subdomains → staging.puredentalglasgow.com → Directory under public_html/staging
# If deploy fails, verify FTP user can see this folder after login (edit path below if Hostinger shows a different prefix).
name: Deploy staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  ftp-deploy:
    # Set repo Variable SKIP_FTP=true if Hostinger blocks GitHub's IPs (ETIMEDOUT on 21/990) — use Hostinger Git or manual upload instead.
    if: ${{ vars.SKIP_FTP != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strip ftp:// from secret — wrong prefix often causes instant failure.
      - name: Normalize FTP hostname
        id: ftp_host
        env:
          RAW: ${{ secrets.FTP_SERVER }}
        run: |
          h="$RAW"
          h="${h#ftp://}"
          h="${h#ftps://}"
          h="${h%/}"
          echo "host=$h" >> "$GITHUB_OUTPUT"

      # Default explicit FTPS on 21 (GitHub runners often time out on 990).
      # Override: Variables FTP_PORT=990 and FTP_PROTOCOL=ftps-legacy if your host requires implicit FTPS.
      - name: Upload to Hostinger (staging)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp_host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          security: loose
          local-dir: ./public/
          server-dir: domains/puredentalglasgow.com/public_html/staging/
          log-level: standard
          timeout: 600000
